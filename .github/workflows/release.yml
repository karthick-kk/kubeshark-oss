name: Release

on:
  push:
    branches:
      - 'develop'
      - 'main'

concurrency:
  group: kubeshark-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guard:
    # The stock workflow assumed every push is a release (auto-inc-ver
    # requires a #major/#minor/#patch hashtag in the commit message and
    # failed on any plain commit). Only run the release pipeline for
    # actual release commits.
    name: Check for release commit
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Check release hashtag
        id: check
        run: |
          if git log -1 --pretty=%B | grep -qE '#(major|minor|patch)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Commit message has no release hashtag (#major/#minor/#patch) - skipping release"
          fi

      - name: Check Docker Hub secrets
        if: steps.check.outputs.release == 'true'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Repository secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured"
            exit 1
          fi

  docker-registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [release-guard]
    if: needs.release-guard.outputs.release == 'true'

    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        target:
          - amd64
          - arm64v8

    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Determine versioning strategy
        uses: haya14busa/action-cond@v1
        id: condval
        with:
          cond: ${{ github.ref == 'refs/heads/main' }}
          if_true: "stable"
          if_false: "dev"

      - name: Auto Increment Ver Action
        uses: docker://igorgov/auto-inc-ver:v2.0.0
        id: versioning
        with:
          mode: ${{ steps.condval.outputs.value }}
          suffix: 'dev'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version parameters
        shell: bash
        run: |
          echo "##[set-output name=build_timestamp;]$(echo $(date +%s))"
          echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: version_parameters

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            karthickk/kubeshark-oss
          tags: |
            type=raw,${{ steps.versioning.outputs.version }}
            type=raw,value=latest,enable=${{ steps.condval.outputs.value == 'stable' }}
            type=raw,value=dev-latest,enable=${{ steps.condval.outputs.value == 'dev' }}
          flavor: |
            latest=auto
            prefix=
            suffix=-${{ matrix.target }},onlatest=true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETARCH=${{ matrix.target }}
            VER=${{ steps.versioning.outputs.version }}
            BUILD_TIMESTAMP=${{ steps.version_parameters.outputs.build_timestamp }}
            GIT_BRANCH=${{ steps.version_parameters.outputs.branch }}
            COMMIT_HASH=${{ github.sha }}

  docker-manifest:
    name: Create and Push a Docker Manifest
    runs-on: ubuntu-latest
    needs: [docker-registry]
    if: needs.release-guard.outputs.release == 'true'
    steps:
      - name: Determine versioning strategy
        uses: haya14busa/action-cond@v1
        id: condval
        with:
          cond: ${{ github.ref == 'refs/heads/main' }}
          if_true: "stable"
          if_false: "dev"

      - name: Auto Increment Ver Action
        uses: docker://igorgov/auto-inc-ver:v2.0.0
        id: versioning
        with:
          mode: ${{ steps.condval.outputs.value }}
          suffix: 'dev'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version parameters
        shell: bash
        run: |
          echo "##[set-output name=build_timestamp;]$(echo $(date +%s))"
          echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: version_parameters

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            karthickk/kubeshark-oss
          tags: |
            type=raw,${{ steps.versioning.outputs.version }}
            type=raw,value=latest,enable=${{ steps.condval.outputs.value == 'stable' }}
            type=raw,value=dev-latest,enable=${{ steps.condval.outputs.value == 'dev' }}
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest
        run: |
          while IFS= read -r line; do
            docker manifest create $line --amend $line-amd64 --amend $line-arm64v8
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push manifest
        run: |
          while IFS= read -r line; do
            docker manifest push $line
          done <<< "${{ steps.meta.outputs.tags }}"
